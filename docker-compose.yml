services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orderdesk
      POSTGRES_PASSWORD: orderdesk
      POSTGRES_DB: orderdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    depends_on:
      - db
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://orderdesk:orderdesk@db:5432/orderdesk
    ports:
      - "8000:8000"
volumes:
  pgdata:
